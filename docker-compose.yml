# docker compose up -d   →   http://localhost:8000
services:
  app:
    build: .
    image: youtube-to-mp3
    container_name: youtube-to-mp3
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      APP_PORT: "${APP_PORT:-8000}"
      # Running on a server? Set a password so only you can use the app
      # (write each $ of a hashed password as $$):
      # APP_PASSWORD: "choose-a-long-password"
      # Optional: a cookies.txt exported from your browser, if YouTube asks to
      # "confirm you're not a bot" (browser cookies cannot be read inside Docker).
      # Put the file in ./docker-data and uncomment:
      # YTDLP_COOKIES_FILE: /data/cookies.txt
    volumes:
      # Database, app key and settings
      - ./docker-data:/data
      # Your converted music
      - ./downloads:/downloads
